<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부노트</title>
<style>
  /* ponytail: 배너 높이는 브라우저/기기마다 몇 px씩 다를 수 있음.
     안 잘리거나 너무 많이 잘리면 이 값만 조절할 것 (기본 56px). */
  :root { --gas-banner-height: 56px; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }

  #frame-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

  #app-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* 배너 높이만큼 끌어올려 잘라내는 클립은 데스크톱에서만(.clip 클래스, JS가 판단해서 붙임).
     모바일은 기기/브라우저마다 배너 높이가 달라(측정 불가 — 다른 출처 iframe) 잘못 잘라내면
     부노트 자체 상단바(사이드바 토글 포함)까지 함께 잘려 사라지는 사고가 났다(2026-10 실고객
     신고). 모바일은 안전하게 배너를 그대로 보여준다(클립 생략) — 미관보다 기능 우선. */
  #frame-wrap.clip #app-frame {
    top: calc(-1 * var(--gas-banner-height));
    height: calc(100% + var(--gas-banner-height));
  }

  #error-msg {
    display: none;
    padding: 40px;
    font: 14px/1.6 sans-serif;
    color: #666;
  }
</style>
</head>
<body>
  <div id="frame-wrap">
    <iframe id="app-frame"></iframe>
  </div>
  <div id="error-msg">잘못된 접속 링크입니다. 고객사별 URL을 다시 확인해주세요.</div>

  <script>
    // 사용법: 이 페이지 주소 뒤에 ?u=<고객 /exec 배포 URL(URL 인코딩)> 붙여서 접속
    // 예: https://내도메인.com/?u=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycb...%2Fexec
    var raw = new URLSearchParams(location.search).get('u');

    // 신뢰 경계: script.google.com 도메인의 /exec 배포 URL만 허용 (임의 사이트 iframe 방지)
    var isValid = raw && /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[A-Za-z0-9_-]+\/exec$/.test(raw);

    if (isValid) {
      // 데스크톱(768px 초과)만 배너 클립 적용 — 모바일은 배너 그대로 노출(위 CSS 주석 참고).
      if (window.innerWidth > 768) document.getElementById('frame-wrap').classList.add('clip');
      document.getElementById('app-frame').src = raw;
    } else {
      document.getElementById('frame-wrap').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
