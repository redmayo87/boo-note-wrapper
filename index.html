<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부노트</title>
<style>
  /* ponytail: 배너 높이는 브라우저/기기마다 몇 px씩 다를 수 있음.
     안 잘리거나 너무 많이 잘리면 이 값만 조절할 것 (기본 56px). */
  :root { --gas-banner-height: 56px; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }

  #frame-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

  #app-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* [2026-10 전면 비활성화] 아래 JS가 더 이상 .clip을 붙이지 않음 — 데스크톱/모바일 둘 다 적용 안 됨.
     cross-origin iframe이라 실제 구글 배너 높이를 측정할 방법이 없어 56px 고정값 추측이 배너 대신
     부노트 자체 상단바(알림/장바구니/테마토글/사이드바)를 잘라먹는 사고가 반복됨(모바일→데스크톱
     순으로 재현). 규칙 자체는 남겨두되(나중에 신뢰할 측정법이 생기면 재활성화 가능) 현재는 죽은 코드. */
  #frame-wrap.clip #app-frame {
    top: calc(-1 * var(--gas-banner-height));
    height: calc(100% + var(--gas-banner-height));
  }

  #error-msg {
    display: none;
    padding: 40px;
    font: 14px/1.6 sans-serif;
    color: #666;
  }
</style>
</head>
<body>
  <div id="frame-wrap">
    <iframe id="app-frame"></iframe>
  </div>
  <div id="error-msg">잘못된 접속 링크입니다. 고객사별 URL을 다시 확인해주세요.</div>

  <script>
    // 사용법: 이 페이지 주소 뒤에 ?u=<고객 /exec 배포 URL(URL 인코딩)> 붙여서 접속
    // 예: https://내도메인.com/?u=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycb...%2Fexec
    var raw = new URLSearchParams(location.search).get('u');

    // 신뢰 경계: script.google.com 도메인의 /exec 배포 URL만 허용 (임의 사이트 iframe 방지).
    // /exec 뒤 쿼리스트링(?mode=detail&id=... 등)도 허용 — 상세정보/장바구니 팝업은 /exec에 쿼리가
    // 붙은 URL을 그대로 u로 넘기는데, 예전엔 끝앵커($)가 /exec 바로 뒤라 쿼리 붙은 링크를 전부
    // "잘못된 접속 링크"로 막아버렸다(2026-10 실고객 신고 — 상세정보/장바구니 팝업 전부 안 열림).
    var isValid = raw && /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[A-Za-z0-9_-]+\/exec(\?.*)?$/.test(raw);

    if (isValid) {
      // [2026-10 비활성화] 데스크톱 클립도 실고객 환경에서 배너 대신 부노트 자체 상단바(알림/장바구니/
      // 테마토글/사이드바)를 통째로 잘라먹는 사고 발생 — cross-origin iframe이라 실제 배너 높이를 JS로
      // 측정할 방법이 없어 56px 고정값 추측 자체가 신뢰 불가로 판명됨. 신뢰할 측정법 생기기 전까진
      // .clip 미적용(배너는 다시 보이지만 앱 네비게이션은 항상 정상 노출 — 기능이 미관보다 우선).
      // if (window.innerWidth > 768) document.getElementById('frame-wrap').classList.add('clip');
      document.getElementById('app-frame').src = raw;
    } else {
      document.getElementById('frame-wrap').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
